[package]
name = "clawtao"
version = "0.0.1"
edition = "2021"
authors = ["ClawTao"]
description = "Rust backend for ClawTao desktop AI agent"

[dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4"] }
chrono = "0.4"
anyhow = "1.0"
dirs = "5.0"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
scraper = "0.20"

[profile.release]
strip = true
lto = true
codegen-units = 1
